<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arena das Equipes</title><style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#fff;font-family:Arial;text-align:center}.box{max-width:520px;margin:20px auto;padding:20px}button,input{width:100%;padding:15px;margin:8px 0;border:0;border-radius:12px;font-size:16px}button{background:#22c55e;color:#fff;font-weight:bold}button:disabled{opacity:.45}input{background:#26323b;color:#fff}.hidden{display:none}.players{text-align:left}.player{background:#26323b;padding:12px;border-radius:10px;margin:6px 0}#map{height:55vh;min-height:360px;border-radius:15px;position:relative;overflow:hidden;background:linear-gradient(35deg,transparent 44%,#777 45%,#777 51%,transparent 52%),linear-gradient(120deg,transparent 45%,#777 46%,#777 52%,transparent 53%),#397344}.house{position:absolute;width:58px;height:48px;background:#b9b9b9;border:3px solid #555;border-radius:5px}.tree{position:absolute;width:34px;height:34px;border-radius:50%;background:#1f5f32}.dot{position:absolute;width:24px;height:24px;border-radius:50%;background:#22c55e;border:3px solid white;transform:translate(-50%,-50%)}#timer{font-size:28px;font-weight:bold;margin:12px}</style></head><body><div class="box"><section id="menu"><h1>⚔️ Arena das Equipes</h1><p>Jogue com seus amigos pela internet!</p><button id="createBtn">CRIAR SALA</button><input id="codeInput" placeholder="Digite o código da sala" maxlength="5"><button id="joinBtn">ENTRAR NA SALA</button><p id="status"></p></section><section id="lobby" class="hidden"><h2>🏠 Sala</h2><p>Código da sala:</p><h1 id="roomCode"></h1><p id="count"></p><div id="players" class="players"></div><button id="startBtn" disabled>COMEÇAR PARTIDA</button><p id="lobbyStatus"></p></section><section id="game" class="hidden"><h2>⚔️ Arena</h2><p id="gameInfo">Fase de coleta</p><div id="timer">30</div><div id="map"><div class="house" style="left:18%;top:18%"></div><div class="house" style="left:65%;top:20%"></div><div class="house" style="left:42%;top:58%"></div><div class="house" style="left:72%;top:70%"></div><div class="tree" style="left:10%;top:60%"></div><div class="tree" style="left:30%;top:34%"></div><div class="tree" style="left:55%;top:12%"></div><div class="tree" style="left:82%;top:48%"></div><div id="me" class="dot" style="left:50%;top:50%"></div></div></section></div><script>const MAX_PLAYERS=4;let ws,myId="",roomCode="",isHost=false,timerId=null;const $=id=>document.getElementById(id);function wsUrl(){return(location.protocol==="https:"?"wss:":"ws:")+"//"+location.host}function connect(){ws=new WebSocket(wsUrl());ws.onopen=()=>$("status").textContent="Conectado.";ws.onclose=()=>$("status").textContent="Conexão encerrada. Recarregue a página.";ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="welcome")myId=m.id;if(m.type==="error")alert(m.message);if(m.type==="room_state"){roomCode=m.code;isHost=m.hostId===myId;showLobby(m)}if(m.type==="game_started")showGame(m.lootSeconds||30)}}function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}function showLobby(m){$("menu").classList.add("hidden");$("game").classList.add("hidden");$("lobby").classList.remove("hidden");$("roomCode").textContent=m.code;$("count").textContent=`Jogadores: ${m.players.length}/${MAX_PLAYERS}`;$("players").innerHTML=m.players.map((p,i)=>`<div class="player">${i+1}. ${p.id===m.hostId?"👑 Dono da sala":"👤 Jogador"}</div>`).join("");$("startBtn").style.display=isHost?"block":"none";$("startBtn").disabled=!isHost||m.players.length<2;$("lobbyStatus").textContent=isHost?(m.players.length<2?"Aguardando pelo menos 2 jogadores...":"Você pode começar a partida."):"Aguardando o dono da sala iniciar a partida..."}function showGame(seconds){$("lobby").classList.add("hidden");$("game").classList.remove("hidden");let n=seconds;$("timer").textContent=n;clearInterval(timerId);timerId=setInterval(()=>{n--;$("timer").textContent=Math.max(0,n);if(n<=0){clearInterval(timerId);$("gameInfo").textContent="🔥 Arena liberada!"}},1000)}$("createBtn").onclick=()=>{connect();setTimeout(()=>send({type:"create_room"}),250)};$("joinBtn").onclick=()=>{const c=$("codeInput").value.trim().toUpperCase();if(c.length!==5)return alert("Digite o código de 5 caracteres.");connect();setTimeout(()=>send({type:"join_room",code:c}),250)};$("startBtn").onclick=()=>send({type:"start_game"});</script></body></html>
